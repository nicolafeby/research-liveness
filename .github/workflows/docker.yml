name: Build & Deploy Liveness App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest .

      - name: Push Image to GHCR
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup cloudflared
        run: |
          sudo apt update
          sudo apt install cloudflared -y

      - name: SSH into Raspi (via Cloudflare) and deploy Docker
        run: |
          echo "${CF_SSH_KEY}" > key.pem
          chmod 600 key.pem

          cloudflared access ssh \
            --hostname ssh.raspi.nicolaboard.my.id \
            --id $CF_TUNNEL_ID \
            --secret $CF_TUNNEL_SECRET \
            --account-id $CF_ACCOUNT_ID \
            --ssh-key key.pem \
            -- ssh -o StrictHostKeyChecking=no $CF_SSH_USER@ssh.raspi.nicolaboard.my.id "
                cd /home/ncladr/app &&
                docker stop myapp || true &&
                docker rm myapp || true &&
                docker build -t myapp . &&
                docker run -d -p 8000:8000 --name myapp myapp
            "

name: Build & Push Multi-Arch Docker Image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # 3. Set up QEMU (enable ARM64 build)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Buildx (multi-platform builder)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build & Push Multi-Arch with CACHE
      - name: Build and Push Multi-Arch Image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness-poc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max





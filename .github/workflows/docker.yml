name: Build & Deploy Liveness App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest .

      - name: Push Image to GHCR
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:22 --hostname ssh-raspi.nicolaboard.my.id &
          sleep 10

      - name: Deploy via SSH over Tunnel
        run: |
          ssh -o "ProxyCommand=nc -x 127.0.0.1:22 %h %p" \
              -i key.pem -o StrictHostKeyChecking=no \
              ncladr@ssh-raspi.nicolaboard.my.id "
                docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest &&
                docker stop liveness || true &&
                docker rm liveness || true &&
                docker run -d -p 8000:8000 --name liveness ghcr.io/${{ secrets.GHCR_USERNAME }}/liveness:latest
              "






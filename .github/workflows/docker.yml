name: Deploy to ARM Server

on:
  push:
    branches:
      - main   # Jalankan workflow setiap push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (needed for Actions context only)
        uses: actions/checkout@v3

      - name: Deploy to ARM Server
        uses: appleboy/ssh-action@v0.1.11
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Pulling latest code"
            cd ~/liveness-project || git clone https://github.com/nicolafeby/liveness.git ~/liveness-project
            cd ~/liveness-project
            git pull

            echo "🛑 Stopping old container"
            docker rm -f liveness || true

            echo "🐳 Building Docker image on ARM64 server"
            docker build -t liveness-poc .

            echo "🚀 Running new container"
            docker run -d --name liveness -p 8000:8000 liveness-poc

            echo "🎉 Deployment completed successfully!"








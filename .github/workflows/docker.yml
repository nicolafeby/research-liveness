name: Build ARM64 & Deploy via Cloudflare Tunnel

on:
  push:
    branches: ["main"]

jobs:
  # ----------------------------------------------------------
  # JOB 1 — BUILD IMAGE ARM64 & PUSH GHCR
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build & Push ARM64 Image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: ghcr.io/nicolafeby/research-liveness:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # JOB 2 — START CLOUDFLARE TUNNEL
  # ----------------------------------------------------------
  tunnel:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Install cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Create Cloudflare Tunnel Config
      run: |
        mkdir -p ~/.cloudflared
        cat > ~/.cloudflared/${{ secrets.CF_TUNNEL_ID }}.json <<EOF
        {
          "AccountTag": "${{ secrets.CF_ACCOUNT_ID }}",
          "TunnelSecret": "${{ secrets.CF_TUNNEL_SECRET }}",
          "TunnelID": "${{ secrets.CF_TUNNEL_ID }}"
        }
        EOF

        cat > ~/.cloudflared/config.yml <<EOF
        tunnel: ${{ secrets.CF_TUNNEL_ID }}
        credentials-file: /home/runner/.cloudflared/${{ secrets.CF_TUNNEL_ID }}.json
        ingress:
          - service: ssh://localhost:22
        EOF

    - name: Start Cloudflare Tunnel
      id: cloudflare
      run: |
        nohup cloudflared tunnel run ${{ secrets.CF_TUNNEL_ID }} > tunnel.log 2>&1 &
        sleep 5

  # ----------------------------------------------------------
  # JOB 3 — DEPLOY VIA SSH → PULL IMAGE → RUN CONTAINER
  # ----------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: tunnel

    steps:
    - name: Add SSH Key (ED25519)
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.CF_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Configure SSH
      run: |
        echo "Host *" > ~/.ssh/config
        echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config
        echo "  IdentitiesOnly yes" >> ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Debug SSH Files
      run: |
        ls -l ~/.ssh
        echo "--- PRIVATE KEY START ---"
        sed 's/./*/g' ~/.ssh/id_ed25519 | head -n 5
        echo "--- PRIVATE KEY END ---"

    - name: Deploy to Server via Cloudflare SSH
      run: |
        ssh \
          -o ProxyCommand="cloudflared access ssh --hostname ssh-raspi.nicolaboard.my.id" \
          -o StrictHostKeyChecking=no \
          ${{ secrets.CF_SSH_USER }}@ssh-raspi.nicolaboard.my.id << 'EOF'

            echo "📥 Pull latest image"
            docker pull ghcr.io/nicolafeby/research-liveness:latest

            echo "🛑 Removing old container"
            docker rm -f liveness || true

            echo "🚀 Starting new container"
            docker run -d \
              --name liveness \
              -p 8000:8000 \
              ghcr.io/nicolafeby/research-liveness:latest

            echo "🎉 Deployment Done!"
        EOF














<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Liveness Detection POC 🎥</title>
      <style>
         body { font-family: Arial; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; }
         #container { position: relative; width:480px; height:360px; }
         video { width:100%; height:100%; border-radius:10px; }
         canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
         #status { padding:10px 20px; border-radius:5px; margin-top:10px; }
         #status.real { background-color: #4caf50; color:white; }
         #status.fake { background-color: #f44336; color:white; }
         #status.loading { background-color:#ff9800; color:white; }
         button { padding:10px 20px; margin-top:10px; border:none; border-radius:5px; background-color:#2196f3; color:white; cursor:pointer; }
         button.disconnect { background-color:#f44336; }
      </style>
   </head>
   <body>
      <h1>Liveness Detection POC 🎥</h1>
      <div id="container">
         <video id="video" autoplay muted playsinline></video>
         <canvas id="overlay"></canvas>
      </div>
      <div id="status" class="loading">Disconnected</div>
      <button id="connectBtn">Connect</button>
      <script>
         const video = document.getElementById('video');
         const canvas = document.getElementById('overlay');
         const ctx = canvas.getContext('2d');
         const statusDiv = document.getElementById('status');
         const connectBtn = document.getElementById('connectBtn');
         
         let socket = null;
         let stream = null;
         let sendInterval = null;
         let animFrameId = null;
         
         // Current and previous positions for smooth trailing
         let overlayData = { faces: [], eyes: [], smiles: [], liveness:false, blink:false, smile:false };
         let prevFaces = [], prevEyes = [], prevSmiles = [];
         
         // Timestamps untuk animasi sementara
         let blinkTimer = 0, smileTimer = 0;
         
         connectBtn.addEventListener('click', () => {
           if(!socket || socket.readyState===WebSocket.CLOSED) startConnection();
           else disconnect();
         });
         
         function lerp(a, b, t){ return a + (b-a)*t; }
         
         async function startConnection(){
           socket = new WebSocket('ws://' + window.location.host + '/liveness');
           statusDiv.textContent='Connecting...';
           statusDiv.className='loading';
           connectBtn.textContent='Disconnect';
           connectBtn.classList.add('disconnect');
         
           socket.onopen = async () => {
             statusDiv.textContent='Streaming...';
             statusDiv.className='loading';
             await startCamera();
             drawOverlay();
           };
         
           socket.onmessage = event => {
             overlayData = JSON.parse(event.data);
             if(overlayData.blink) blinkTimer = performance.now();
             if(overlayData.smile) smileTimer = performance.now();
         
             statusDiv.textContent = overlayData.liveness ? '✅ Liveness Detected' : '❌ Fake / Spoof Detected';
             statusDiv.className = overlayData.liveness ? 'real' : 'fake';
           };
         
           socket.onclose = () => disconnect();
         }
         
         async function startCamera(){
           try{
             stream = await navigator.mediaDevices.getUserMedia({ video:true });
             video.srcObject = stream;
         
             video.onloadedmetadata = ()=>{
               canvas.width = video.videoWidth;
               canvas.height = video.videoHeight;
             };
         
             sendInterval = setInterval(()=>{
               if(socket && socket.readyState===WebSocket.OPEN){
                 const tempCanvas = document.createElement('canvas');
                 tempCanvas.width = video.videoWidth;
                 tempCanvas.height = video.videoHeight;
                 const tempCtx = tempCanvas.getContext('2d');
                 tempCtx.drawImage(video,0,0,tempCanvas.width,tempCanvas.height);
         
                 tempCanvas.toBlob(blob=>{
                   const reader = new FileReader();
                   reader.onloadend = ()=>socket.send(reader.result.split(',')[1]);
                   reader.readAsDataURL(blob);
                 },'image/jpeg',0.7);
               }
             }, 200);
           } catch(err){
             console.error('Camera access denied:',err);
             statusDiv.textContent='Camera access denied';
             statusDiv.className='fake';
           }
         }
         
         // Draw rectangles with trailing effect
         function drawOverlay(){
           ctx.clearRect(0,0,canvas.width,canvas.height);
           const t = 0.2; // smoothing factor for lerp
           const now = performance.now();
         
           function smoothRects(prev, curr){
             const out = [];
             for(let i=0;i<curr.length;i++){
               const c = curr[i];
               const p = prev[i]||{x:c.x,y:c.y,w:c.w,h:c.h};
               out.push({
                 x: lerp(p.x, c.x, t),
                 y: lerp(p.y, c.y, t),
                 w: lerp(p.w, c.w, t),
                 h: lerp(p.h, c.h, t)
               });
             }
             return out;
           }
         
           prevFaces = smoothRects(prevFaces, overlayData.faces||[]);
           prevEyes = smoothRects(prevEyes, overlayData.eyes||[]);
           prevSmiles = smoothRects(prevSmiles, overlayData.smiles||[]);
         
           // wajah
           prevFaces.forEach(f=>{
             ctx.strokeStyle = overlayData.liveness ? 'lime':'red';
             ctx.lineWidth = 3;
             ctx.strokeRect(f.x,f.y,f.w,f.h);
           });
         
           // mata
           prevEyes.forEach(e=>{
             ctx.strokeStyle = (blinkTimer && now - blinkTimer<300)? 'cyan':'blue';
             ctx.lineWidth = 2;
             ctx.strokeRect(e.x,e.y,e.w,e.h);
           });
         
           // senyum
           prevSmiles.forEach(s=>{
             ctx.strokeStyle = (smileTimer && now - smileTimer<500)? 'orange':'red';
             ctx.lineWidth = 2;
             ctx.strokeRect(s.x,s.y,s.w,s.h);
           });
         
           animFrameId = requestAnimationFrame(drawOverlay);
         }
         
         function stopCamera(){
           if(sendInterval) clearInterval(sendInterval);
           if(animFrameId) cancelAnimationFrame(animFrameId);
           if(stream){
             stream.getTracks().forEach(t=>t.stop());
             stream=null;
           }
           ctx.clearRect(0,0,canvas.width,canvas.height);
         }
         
         function disconnect(){
           if(socket && socket.readyState===WebSocket.OPEN) socket.close();
           stopCamera();
           overlayData = { faces: [], eyes: [], smiles: [], liveness:false, blink:false, smile:false };
           prevFaces = prevEyes = prevSmiles = [];
           statusDiv.textContent='Disconnected';
           statusDiv.className='';
           connectBtn.textContent='Connect';
           connectBtn.classList.remove('disconnect');
         }
      </script>
   </body>
</html>

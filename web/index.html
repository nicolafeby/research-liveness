<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Liveness Detection POC 🎥</title>
      <style>
         body { font-family: Arial; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
         #container { position: relative; width:480px; height:360px; }
         video { width:100%; height:100%; border-radius:10px; background:black; }
         canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
         #status { padding:10px 20px; border-radius:5px; margin-top:15px; font-weight:bold; }
         #status.real { background:#4caf50; color:white; }
         #status.fake { background:#f44336; color:white; }
         #status.loading { background:#ff9800; color:white; }
         button { padding:10px 20px; margin-top:10px; border:none; border-radius:6px; font-size:16px; background:#2196f3; color:white; cursor:pointer; }
         button.disconnect { background:#d32f2f; }
      </style>
   </head>
   <body>
      <h1>Liveness Detection POC 🎥</h1>
      <div id="container">
         <video id="video" autoplay muted playsinline></video>
         <canvas id="overlay"></canvas>
      </div>
      <div id="status" class="loading">Disconnected</div>
      <button id="connectBtn">Connect</button>
      <script>
         /* ========== Element references ========== */
         const video = document.getElementById('video');
         const canvas = document.getElementById('overlay');
         const ctx = canvas.getContext('2d');
         const statusDiv = document.getElementById('status');
         const connectBtn = document.getElementById('connectBtn');
         
         /* ========== State ========== */
         let socket = null;
         let stream = null;
         let sendInterval = null;
         let animFrameId = null;
         
         // Faces, eyes, smiles
         let overlayData = { faces: [], eyes: [], smiles: [], liveness:false, blink:false, smile:false };
         let prevFaces = [], prevEyes = [], prevSmiles = [];
         
         let blinkTimer = 0, smileTimer = 0;
         
         /* ========== Helpers ========== */
         function lerp(a, b, t) { return a + (b - a) * t; }
         
         function setStatus(text, cls) {
           statusDiv.textContent = text;
           statusDiv.className = cls;
         }
         
         /* ========== Connect Button ========== */
         connectBtn.addEventListener("click", () => {
           if (!socket || socket.readyState === WebSocket.CLOSED) startConnection();
           else disconnect();
         });
         
         /* ========== START CONNECTION ========== */
         async function startConnection() {
         
           // FIX: wajib gunakan wss:// untuk domain HTTPS
           const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
           const wsUrl = protocol + window.location.host + "/liveness";
         
           socket = new WebSocket(wsUrl);
         
           setStatus("Connecting...", "loading");
           connectBtn.textContent = "Disconnect";
           connectBtn.classList.add("disconnect");
         
           socket.onopen = async () => {
             setStatus("Streaming...", "loading");
             await startCamera();
             drawOverlay();
           };
         
           socket.onmessage = (event) => {
             overlayData = JSON.parse(event.data);
         
             if (overlayData.blink) blinkTimer = performance.now();
             if (overlayData.smile) smileTimer = performance.now();
         
             setStatus(
               overlayData.liveness ? "✅ Liveness Detected" : "❌ Fake / Spoof Detected",
               overlayData.liveness ? "real" : "fake"
             );
           };
         
           socket.onerror = () => {
             setStatus("WebSocket Error", "fake");
           };
         
           socket.onclose = () => {
             disconnect();
           };
         }
         
         /* ========== START CAMERA & SEND FRAMES ========== */
         async function startCamera() {
           try {
             stream = await navigator.mediaDevices.getUserMedia({ video: true });
             video.srcObject = stream;
         
             video.onloadedmetadata = () => {
               canvas.width = video.videoWidth;
               canvas.height = video.videoHeight;
             };
         
             sendInterval = setInterval(() => {
               if (socket && socket.readyState === WebSocket.OPEN) {
                 const temp = document.createElement("canvas");
                 temp.width = video.videoWidth;
                 temp.height = video.videoHeight;
                 const tctx = temp.getContext("2d");
         
                 tctx.drawImage(video, 0, 0, temp.width, temp.height);
         
                 temp.toBlob((blob) => {
                   const reader = new FileReader();
                   reader.onloadend = () => socket.send(reader.result.split(",")[1]);
                   reader.readAsDataURL(blob);
                 }, "image/jpeg", 0.7);
               }
             }, 200);
         
           } catch (err) {
             setStatus("Camera access denied", "fake");
           }
         }
         
         /* ========== DRAW OVERLAY ========== */
         function drawOverlay() {
           ctx.clearRect(0, 0, canvas.width, canvas.height);
           const now = performance.now();
           const t = 0.25;
         
           function smooth(prev, curr) {
             const out = [];
             for (let i = 0; i < curr.length; i++) {
               const c = curr[i];
               const p = prev[i] || c;
               out.push({
                 x: lerp(p.x, c.x, t),
                 y: lerp(p.y, c.y, t),
                 w: lerp(p.w, c.w, t),
                 h: lerp(p.h, c.h, t)
               });
             }
             return out;
           }
         
           prevFaces = smooth(prevFaces, overlayData.faces || []);
           prevEyes  = smooth(prevEyes, overlayData.eyes  || []);
           prevSmiles = smooth(prevSmiles, overlayData.smiles || []);
         
           // Faces
           prevFaces.forEach((f) => {
             ctx.strokeStyle = overlayData.liveness ? "lime" : "red";
             ctx.lineWidth = 3;
             ctx.strokeRect(f.x, f.y, f.w, f.h);
           });
         
           // Eyes
           prevEyes.forEach((e) => {
             ctx.strokeStyle = (now - blinkTimer < 300) ? "cyan" : "blue";
             ctx.lineWidth = 2;
             ctx.strokeRect(e.x, e.y, e.w, e.h);
           });
         
           // Smiles
           prevSmiles.forEach((s) => {
             ctx.strokeStyle = (now - smileTimer < 500) ? "orange" : "red";
             ctx.lineWidth = 2;
             ctx.strokeRect(s.x, s.y, s.w, s.h);
           });
         
           animFrameId = requestAnimationFrame(drawOverlay);
         }
         
         /* ========== DISCONNECT ========== */
         function disconnect() {
           if (socket && socket.readyState === WebSocket.OPEN) socket.close();
         
           if (sendInterval) clearInterval(sendInterval);
           if (animFrameId) cancelAnimationFrame(animFrameId);
           if (stream) {
             stream.getTracks().forEach((t) => t.stop());
             stream = null;
           }
         
           overlayData = { faces: [], eyes: [], smiles: [], liveness:false };
           prevFaces = prevEyes = prevSmiles = [];
         
           setStatus("Disconnected", "");
           connectBtn.textContent = "Connect";
           connectBtn.classList.remove("disconnect");
         }
      </script>
   </body>
</html>
